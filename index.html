<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previsiones Presupuestarias – ATU</title>
<style>
  /* Página de acceso (GitHub Pages). Abre el aplicativo de Apps Script en la misma pestaña.
     Ya no se usa iframe: Chrome bloquea el inicio de sesión de Google dentro de un iframe de otro dominio
     (cookies de terceros / varias cuentas), lo que mostraba una hoja gris con la carita triste. */
  :root { --navy:#1f3a5f; --ink:#14213d; --muted:#6b7280; --bg:#f3f5f8; --teal:#0f766e; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { background:var(--navy); color:#fff; padding:10px 16px; }
  .bar b { font-weight:600; } .bar span { opacity:.75; font-size:12px; margin-left:10px; }
  .card { max-width:560px; margin:56px auto; padding:28px; background:#fff; border-radius:12px;
    box-shadow:0 1px 3px rgba(16,24,40,.12); text-align:center; }
  .card h1 { font-size:20px; margin:0 0 6px; }
  .card p { color:var(--muted); margin:6px 0; }
  .btn { display:inline-block; margin-top:16px; background:var(--teal); color:#fff; padding:10px 22px;
    border-radius:8px; text-decoration:none; font-weight:600; }
  .spin { width:28px; height:28px; border:3px solid #d7dde5; border-top-color:var(--teal); border-radius:50%;
    margin:4px auto 14px; animation:g 0.9s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  small { display:block; margin-top:18px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div class="bar"><b>Previsiones Presupuestarias</b><span>ATU · Oficina de Planeamiento y Presupuesto</span></div>
  <div class="card">
    <div class="spin" id="spin"></div>
    <h1>Ingresando al aplicativo…</h1>
    <p>Se abrirá con su cuenta de Google. Si no avanza en unos segundos, use el botón.</p>
    <a class="btn" id="ir" href="#">Ingresar al aplicativo</a>
    <small>Si Google le pide elegir cuenta, use la cuenta registrada en la hoja USUARIOS.</small>
  </div>
<script>
  // ▼▼▼ URL de la aplicación web (Implementar → Gestionar implementaciones → URL que termina en /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzggga_LPM8uAg6o6j43FHU-vccGbuZmcET53lrAVwjqF6R2pKYliNs44XXXD7_5fnrzg/exec';
  // ▲▲▲
  document.getElementById('ir').href = APP_URL;
  // Si esta página quedó dentro de un marco, sale de él; luego abre el aplicativo en la misma pestaña
  try { if (window.top !== window.self) window.top.location.href = location.href; } catch (e) {}
  setTimeout(() => location.replace(APP_URL), 600);
</script>
</body>
</html>
